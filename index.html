  background-position: center, center, center, center, center, center top;
  background-repeat: no-repeat;
  color:var(--fg);
  font-family:'Work Sans', -apple-system, sans-serif;
  padding-inline:20px;
  padding-block:24px;
}
.wrap{ max-width:880px; margin:0 auto; display:flex; flex-direction:column; gap:28px; }
.brand-row{ display:flex; align-items:center; gap:14px; }
.brand-logo{ width:48px; height:48px; border-radius:50%; flex-shrink:0; filter:drop-shadow(0 0 14px rgba(232,95,242,0.35)); }
h1{ font-family:'Bebas Neue', 'Work Sans', sans-serif; font-weight:400; font-size:clamp(34px,8vw,50px); letter-spacing:0.02em; text-transform:uppercase; margin:0; line-height:0.95; text-wrap:balance; }
.subtitle{ color:var(--muted); font-size:12px; margin-top:6px; letter-spacing:0.12em; text-transform:uppercase; }
header.top{ display:flex; flex-wrap:wrap; gap:16px; justify-content:space-between; align-items:flex-end; }
.refresh-box{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; min-width:0; }
button.refresh{
  font-family:'Work Sans', sans-serif; font-weight:600; font-size:13px; letter-spacing:0.03em;
  background:var(--accent-guest); color:#1a0a1c; border:none; border-radius:999px;
  padding:10px 20px; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
  box-shadow:0 0 22px rgba(232,95,242,0.3);
  transition:filter .15s ease, transform .15s ease;
}
button.refresh:hover{ filter:brightness(1.1); }
button.refresh:active{ transform:scale(0.97); }
button.refresh:disabled{ opacity:0.6; cursor:default; box-shadow:none; }
button.refresh:focus-visible{ outline:2px solid var(--accent-guest); outline-offset:3px; }
.spin{ display:inline-block; width:13px; height:13px; border-radius:50%; border:2px solid rgba(26,10,28,0.35); border-top-color:#1a0a1c; animation:spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.status-line{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.status-line.err{ color:var(--danger); }
.stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:12px; }
.stat{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; min-width:0; }
.stat .label{ font-size:11px; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; }
.stat .value{ font-family:'IBM Plex Mono', monospace; font-size:28px; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums; }
.stat.guest .value{ color:var(--accent-guest); text-shadow:0 0 18px var(--accent-guest-soft); }
.stat.regular .value{ color:var(--accent-regular); text-shadow:0 0 18px var(--accent-regular-soft); }
section.panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
.panel h2{ font-family:'Bebas Neue', 'Work Sans', sans-serif; font-weight:400; font-size:20px; letter-spacing:0.04em; text-transform:uppercase; margin:0 0 4px; }
.panel .hint{ font-size:13px; color:var(--muted); margin-bottom:0; }
.panel-head{ display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
.chart-toggle{ display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px; flex-shrink:0; }
.chart-toggle button{
  font-family:'Work Sans', sans-serif; font-weight:600; font-size:12px; letter-spacing:0.01em;
  background:transparent; color:var(--muted); border:none; border-radius:999px;
  padding:7px 14px; cursor:pointer; transition:background .15s ease, color .15s ease;
}
.chart-toggle button.active{ background:var(--accent-guest); color:#1a0a1c; }
.chart-toggle button:focus-visible{ outline:2px solid var(--accent-guest); outline-offset:2px; }
.legend{ display:flex; gap:18px; font-size:13px; color:var(--muted); margin-bottom:12px; flex-wrap:wrap; }
.legend span{ display:inline-flex; align-items:center; gap:6px; }
.legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }
.legend .g i{ background:var(--accent-guest); }
.legend .r i{ background:var(--accent-regular); }
.chart-scroll{ overflow-x:auto; padding-bottom:4px; position:relative; }
.hit-col{ fill:transparent; cursor:pointer; }
.hit-col:hover ~ .gridline{ }
.point-detail{
  position:absolute; z-index:5; min-width:148px;
  background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; box-shadow:0 12px 28px rgba(0,0,0,0.45);
  font-size:12px; line-height:1.5; pointer-events:none;
  transform:translate(-50%, 0);
}
.point-detail .pd-date{ font-weight:600; font-size:13px; color:var(--fg); margin-bottom:2px; }
.point-detail .pd-note{ color:var(--muted); margin-bottom:6px; }
.point-detail .pd-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.point-detail .pd-row + .pd-row{ margin-top:3px; }
.point-detail .pd-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; flex-shrink:0; }
.point-detail .pd-label{ display:flex; align-items:center; color:var(--muted); }
.point-detail .pd-value{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-variant-numeric:tabular-nums; }
.point-detail .pd-total{ margin-top:6px; padding-top:6px; border-top:1px solid var(--border); display:flex; justify-content:space-between; font-weight:600; }
.chart-scroll svg{ display:block; }
.chart-scroll text{ fill:var(--fg); font-family:'Work Sans', sans-serif; }
.chart-scroll .muted-text{ fill:var(--muted); }
.chart-scroll .gridline{ stroke:var(--border); stroke-width:1; }
.table-wrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:14px; min-width:460px; }
th, td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
th{ color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.03em; }
td.num{ font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; text-align:right; }
td.note{ color:var(--muted); white-space:normal; }
tr:last-child td{ border-bottom:none; }
.empty, .error-box{ text-align:center; padding:32px 16px; color:var(--muted); font-size:14px; }
.error-box{ color:var(--danger); }
footer{ text-align:center; font-size:12px; color:var(--muted); padding-bottom:8px; }
img.max{ max-width:100%; }
</style>

<script>
(function(){
  "use strict";

  // 이 부분의 아이디만 바꾸면 다른 시트에도 쓸 수 있어요.
  var SHEET_ID = "1N2RrGDg9gtygdanRUBdiIfDhQMbO01sS5A-waaOV_DA";
  var GID = "0";

  var SEED_CSV = "날짜,요일,게스트,일반,비고\n" +
    "26.09.25,금,30,5,추석\n" +
    "26.09.26,토,20,9,추석\n" +
    "26.10.02,금,81,17,DJ 생일\n" +
    "26.10.03,토,19,24,티행사\n";

  var state = { rows: [], chartType: "line" };

  function parseCsv(text){
    var lines = text.replace(/\r\n/g, "\n").split("\n").filter(function(l){ return l.length > 0; });
    if (lines.length < 2) return [];
    function parseLine(line){
      var out = [], cur = "", inQuotes = false;
      for (var i = 0; i < line.length; i++){
        var c = line[i];
        if (inQuotes){
          if (c === '"'){ if (line[i+1] === '"'){ cur += '"'; i++; } else { inQuotes = false; } }
          else { cur += c; }
        } else {
          if (c === '"'){ inQuotes = true; }
          else if (c === ','){ out.push(cur); cur = ""; }
          else { cur += c; }
        }
      }
      out.push(cur);
      return out;
    }
    var header = parseLine(lines[0]).map(function(h){ return h.trim(); });
    return rowsFromCells(header, lines.slice(1).map(parseLine));
  }

  function rowsFromCells(header, cellRows){
    var idx = {
      date: header.indexOf("날짜"),
      weekday: header.indexOf("요일"),
      guest: header.indexOf("게스트"),
      regular: header.indexOf("일반"),
      note: header.indexOf("비고")
    };
    var rows = [];
    cellRows.forEach(function(cols){
      if (cols.every(function(c){ return String(c).trim() === ""; })) return;
      var rawDate = String(idx.date >= 0 ? cols[idx.date] : "").trim();
      rows.push({
        rawDate: rawDate,
        date: parseKoreanDate(rawDate),
        weekday: idx.weekday >= 0 ? String(cols[idx.weekday] || "").trim() : "",
        guest: idx.guest >= 0 ? (parseInt(cols[idx.guest], 10) || 0) : 0,
        regular: idx.regular >= 0 ? (parseInt(cols[idx.regular], 10) || 0) : 0,
        note: idx.note >= 0 ? String(cols[idx.note] || "").trim() : ""
      });
    });
    rows.sort(function(a, b){
      if (!a.date && !b.date) return 0;
      if (!a.date) return 1;
      if (!b.date) return -1;
      return a.date - b.date;
    });
    return rows;
  }

  function parseKoreanDate(raw){
    var m = raw.match(/(\d{2,4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
    if (!m) return null;
    var y = parseInt(m[1], 10);
    if (y < 100) y += 2000;
    var mo = parseInt(m[2], 10) - 1;
    var d = parseInt(m[3], 10);
    var dt = new Date(Date.UTC(y, mo, d));
    return isNaN(dt.getTime()) ? null : dt;
  }

  function formatShortDate(dt){ return dt ? (dt.getUTCMonth() + 1) + "/" + dt.getUTCDate() : "-"; }

  function render(){ renderStats(); renderChart(); renderFooter(); }

  function renderStats(){
    var rows = state.rows;
    var totalGuest = rows.reduce(function(s, r){ return s + r.guest; }, 0);
    var totalRegular = rows.reduce(function(s, r){ return s + r.regular; }, 0);
    document.getElementById("stats").innerHTML =
      statCard("게스트 누계", totalGuest, "guest") +
      statCard("일반 누계", totalRegular, "regular") +
      statCard("전체 방문", totalGuest + totalRegular, "") +
      statCard("기록된 날짜", rows.length, "");
  }

  function statCard(label, value, cls){
    return '<div class="stat ' + cls + '"><div class="label">' + escapeHtml(label) + '</div>' +
      '<div class="value">' + value.toLocaleString("ko-KR") + '</div></div>';
  }

  function renderChart(){
    var container = document.getElementById("chartScroll");
    var rows = state.rows;
    activePointIdx = null;
    if (!rows.length){ container.innerHTML = '<div class="empty">아직 데이터가 없어요.</div>'; return; }

    var colW = 92, chartH = 380, padTop = 32, padBottom = 44, padLeft = 48, padRight = 28;
    var maxVal = rows.reduce(function(m, r){ return Math.max(m, r.guest, r.regular); }, 0);
    maxVal = Math.max(maxVal, 5);
    var niceMax = Math.ceil(maxVal / 5) * 5;
    var innerH = chartH - padTop - padBottom;
    var width = Math.max(padLeft + padRight + (rows.length - 1) * colW, 320);
    var n = rows.length;
    function x(i){ return n > 1 ? padLeft + (i * (width - padLeft - padRight)) / (n - 1) : (padLeft + width - padRight) / 2; }
    function y(v){ return padTop + innerH - (v / niceMax) * innerH; }

    var label = state.chartType === "bar" ? "날짜별 게스트와 일반 방문객 수 막대그래프" : "날짜별 게스트와 일반 방문객 수 선그래프";
    var svg = '<svg viewBox="0 0 ' + width + ' ' + chartH + '" width="' + width + '" height="' + chartH + '" role="img" aria-label="' + label + '">';
    [0, niceMax / 2, niceMax].forEach(function(v){
      var gy = y(v);
      svg += '<line class="gridline" x1="' + padLeft + '" y1="' + gy + '" x2="' + (width - padRight) + '" y2="' + gy + '"></line>';
      svg += '<text class="muted-text" x="' + (padLeft - 8) + '" y="' + (gy + 4) + '" font-size="11" text-anchor="end">' + Math.round(v) + '</text>';
    });

    if (state.chartType === "bar"){
      svg += buildBarSeries(rows, x, y, niceMax, padTop, innerH);
    } else {
      svg += buildLineSeries(rows, "regular", "var(--accent-regular)", x, y, padTop, innerH);
      svg += buildLineSeries(rows, "guest", "var(--accent-guest)", x, y, padTop, innerH);
    }

    rows.forEach(function(r, i){
      var cx = x(i);
      var dateLabel = formatShortDate(r.date) || r.rawDate;
      if (r.weekday) dateLabel += " (" + r.weekday + ")";
      svg += '<text class="muted-text" x="' + cx.toFixed(1) + '" y="' + (chartH - padBottom + 20) + '" font-size="12" font-weight="600" text-anchor="middle" fill="var(--fg)">' + escapeHtml(dateLabel) + '</text>';
    });

    // invisible per-date hit columns, drawn last so they sit on top for clicks/taps
    var hitW = n > 1 ? Math.min(colW, (width - padLeft - padRight) / (n - 1)) : width - padLeft - padRight;
    rows.forEach(function(r, i){
      var cx = x(i);
      svg += '<rect class="hit-col" data-idx="' + i + '" x="' + (cx - hitW / 2).toFixed(1) + '" y="0" width="' + hitW.toFixed(1) + '" height="' + chartH + '" tabindex="0" role="button" aria-label="' + escapeHtml((formatShortDate(r.date) || r.rawDate) + ' 상세보기') + '"></rect>';
    });

    svg += '</svg>';
    container.innerHTML = svg;
    container.insertAdjacentHTML('beforeend', '<div class="point-detail" id="pointDetail" hidden></div>');
    attachChartInteractions(rows, x);
  }

  var activePointIdx = null;

  function pointDetailHtml(r){
    var dateLabel = formatShortDate(r.date) || r.rawDate;
    if (r.weekday) dateLabel += " (" + r.weekday + ")";
    var total = r.guest + r.regular;
    var html = '<div class="pd-date">' + escapeHtml(dateLabel) + '</div>';
    if (r.note) html += '<div class="pd-note">' + escapeHtml(r.note) + '</div>';
    html += '<div class="pd-row"><span class="pd-label"><span class="pd-dot" style="background:var(--accent-guest)"></span>게스트</span><span class="pd-value">' + r.guest + '</span></div>';
    html += '<div class="pd-row"><span class="pd-label"><span class="pd-dot" style="background:var(--accent-regular)"></span>일반</span><span class="pd-value">' + r.regular + '</span></div>';
    html += '<div class="pd-total"><span>합계</span><span>' + total + '</span></div>';
    return html;
  }

  function attachChartInteractions(rows, x){
    var container = document.getElementById("chartScroll");
    var tooltip = document.getElementById("pointDetail");
    if (!container || !tooltip) return;

    function showFor(idx){
      var r = rows[idx];
      if (!r) return;
      tooltip.innerHTML = pointDetailHtml(r);
      tooltip.style.left = x(idx).toFixed(1) + "px";
      tooltip.style.top = "6px";
      tooltip.hidden = false;
      activePointIdx = idx;
    }
    function hide(){
      tooltip.hidden = true;
      activePointIdx = null;
    }

    container.querySelectorAll(".hit-col").forEach(function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        var idx = parseInt(el.getAttribute("data-idx"), 10);
        if (activePointIdx === idx) hide(); else showFor(idx);
      });
      el.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " "){
          e.preventDefault();
          var idx = parseInt(el.getAttribute("data-idx"), 10);
          if (activePointIdx === idx) hide(); else showFor(idx);
        }
      });
    });

    if (!document._nueDashOutsideClickBound){
      document.addEventListener("click", function(e){
        var tt = document.getElementById("pointDetail");
        if (!tt || tt.hidden) return;
        if (e.target.closest && (e.target.closest(".hit-col") || e.target.closest(".point-detail"))) return;
        tt.hidden = true;
        activePointIdx = null;
      });
      document._nueDashOutsideClickBound = true;
    }
  }

  function buildLineSeries(rows, key, color, x, y, padTop, innerH){
    var pts = rows.map(function(r, i){ return [x(i), y(r[key])]; });
    var line = pts.map(function(p, i){ return (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    var areaBase = padTop + innerH;
    var area = "M" + pts[0][0].toFixed(1) + "," + areaBase +
      " " + pts.map(function(p){ return "L" + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") +
      " L" + pts[pts.length - 1][0].toFixed(1) + "," + areaBase + " Z";
    var out = '<path d="' + area + '" fill="' + color + '" opacity="0.08"></path>';
    out += '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>';
    rows.forEach(function(r, i){
      var isLast = i === rows.length - 1;
      var val = r[key];
      var cy = y(val);
      var radius = isLast ? 5 : 3;
      out += '<circle cx="' + x(i).toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + radius + '" fill="var(--surface)" stroke="' + color + '" stroke-width="2"></circle>';
      if (isLast){
        out += '<circle cx="' + x(i).toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="9" fill="' + color + '" opacity="0.18"></circle>';
      }
      if (val > 0){
        out += '<text x="' + x(i).toFixed(1) + '" y="' + (cy - 10).toFixed(1) + '" font-size="11" text-anchor="middle" fill="' + color + '">' + val + '</text>';
      }
    });
    return out;
  }

  function buildBarSeries(rows, x, y, niceMax, padTop, innerH){
    var barW = 22, gap = 8;
    var areaBase = padTop + innerH;
    var out = "";
    rows.forEach(function(r, i){
      var cx = x(i);
      var gx = cx - barW - gap / 2;
      var rx = cx + gap / 2;
      var gh = Math.max(areaBase - y(r.guest), 0);
      var rh = Math.max(areaBase - y(r.regular), 0);
      out += '<rect x="' + gx.toFixed(1) + '" y="' + y(r.guest).toFixed(1) + '" width="' + barW + '" height="' + gh.toFixed(1) + '" rx="3" fill="var(--accent-guest)"></rect>';
      out += '<rect x="' + rx.toFixed(1) + '" y="' + y(r.regular).toFixed(1) + '" width="' + barW + '" height="' + rh.toFixed(1) + '" rx="3" fill="var(--accent-regular)"></rect>';
      if (r.guest > 0) out += '<text x="' + (gx + barW / 2).toFixed(1) + '" y="' + (y(r.guest) - 8).toFixed(1) + '" font-size="11" text-anchor="middle" fill="var(--accent-guest)">' + r.guest + '</text>';
      if (r.regular > 0) out += '<text x="' + (rx + barW / 2).toFixed(1) + '" y="' + (y(r.regular) - 8).toFixed(1) + '" font-size="11" text-anchor="middle" fill="var(--accent-regular)">' + r.regular + '</text>';
    });
    return out;
  }

  function renderFooter(){
    document.getElementById("footer").textContent = "";
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function setStatus(text, isErr){
    var el = document.getElementById("statusLine");
    el.textContent = text;
    el.classList.toggle("err", !!isErr);
  }

  function setLoading(isLoading){
    var btn = document.getElementById("refreshBtn");
    document.getElementById("refreshIcon").innerHTML = isLoading ? '<span class="spin"></span>' : "↻";
    document.getElementById("refreshLabel").textContent = isLoading ? "불러오는 중" : "새로고침";
    btn.disabled = isLoading;
  }

  function timeLabel(d){
    try { return d.toLocaleString("ko-KR", { hour: "2-digit", minute: "2-digit", month: "numeric", day: "numeric" }); }
    catch (e) { return d.toISOString(); }
  }

  // Google Sheets를 백엔드 없이 읽어오기 위해 공개 Visualization API를
  // JSONP 방식(<script> 태그)으로 불러옵니다. CORS 제약이 없어 어떤
  // 도메인에 올려도 동작해요. 시트는 "링크가 있는 모든 사용자: 뷰어"로
  // 공유되어 있어야 합니다.
  var jsonpCounter = 0;
  function fetchSheetJsonp(){
    return new Promise(function(resolve, reject){
      var cbName = "__nueSheetCb" + (jsonpCounter++) + "_" + Date.now();
      var timeoutId = setTimeout(function(){ cleanup(); reject(new Error("timeout")); }, 12000);

      function cleanup(){
        clearTimeout(timeoutId);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[cbName] = function(resp){
        cleanup();
        try {
          if (!resp || resp.status !== "ok" || !resp.table) { reject(new Error("bad_response")); return; }
          var cols = resp.table.cols.map(function(c){ return (c.label || "").trim(); });
          var cellRows = resp.table.rows.map(function(r){
            return r.c.map(function(cell){ return cell ? (cell.v === null || cell.v === undefined ? "" : cell.v) : ""; });
          });
          resolve(rowsFromCells(cols, cellRows));
        } catch (e) { reject(e); }
      };

      var script = document.createElement("script");
      script.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
        "/gviz/tq?gid=" + GID + "&tqx=responseHandler:" + cbName + "&t=" + Date.now();
      script.onerror = function(){ cleanup(); reject(new Error("load_error")); };
      document.body.appendChild(script);
    });
  }

  async function refresh(){
    setLoading(true);
    try {
      var rows = await fetchSheetJsonp();
      state.rows = rows;
      render();
      setStatus("마지막 업데이트: " + timeLabel(new Date()));
    } catch (err) {
      setStatus("시트를 불러오지 못했어요. 시트가 “링크가 있는 모든 사용자: 뷰어”로 공유되어 있는지 확인해주세요.", true);
    } finally {
      setLoading(false);
    }
  }

  document.getElementById("refreshBtn").addEventListener("click", refresh);

  document.getElementById("chartToggle").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-type]");
    if (!btn || btn.classList.contains("active")) return;
    state.chartType = btn.dataset.type;
    this.querySelectorAll("button").forEach(function(b){ b.classList.toggle("active", b === btn); });
    renderChart();
  });

  state.rows = parseCsv(SEED_CSV);
  render();
})();
</script>
